# Per-example overrides for render_example_media.py.
#
# Keys are example paths relative to examples/. All fields are optional:
#   timeout = <seconds>   cutoff for this example (else the --timeout default)
#   fade    = <seconds>   fade-out applied WHEN the recording is cut off
#                         (else the --fade default of 5; set 0 to disable)
#   scale      = <int>    verovio score scale, i.e. notation size (else --scale, 60)
#   plot_scale = <float>  Envelope plot size multiplier (else --plot-scale, 1.0)
#   skip_audio = true     don't record audio -- it's made by hand (e.g. needs SuperCollider)
#   skip_score = true     don't capture the score -- it's made by hand
#                         (set both to leave the example alone entirely)
#
# Timeouts were chosen by reading each script: infinite loops get long enough to
# repeat a few times; finite pieces get long enough to play out.

["Assorted/guitar_arpeggios.py"]
timeout = 25   # ~2.5 turns of the four-chord arpeggio loop (loops forever)

["Assorted/metric_phase.py"]
timeout = 45   # the accelerating chromatic runs; the metronome loops forever

["Assorted/quantization.py"]
timeout = 30   # the 8-beat recording plus one quantized/unquantized comparison

["Assorted/save_and_load_performance/save_performance.py"]
timeout = 30   # the two-part texture accelerating toward tempo 300

["Assorted/save_and_load_performance/load_and_play_performance.py"]
timeout = 35   # a couple of playbacks under the accelerando (loops forever)

["Assorted/evolving_form/evolving_form.py"]
skip_audio = true   # full sound needs SuperCollider; audio rendered by hand
scale = 40

["Assorted/evolving_form/formal_parameters.py"]
plot_scale = 0.5   # its 8 plots are small enough to sit two-plus per row

["ScampExtensions/time_varying_parameter_example.py"]
timeout = 90   # lets the ~60-beat form play out

["Assorted/octava.py"]
scale = 40

# SuperCollider examples: their real sound needs SuperCollider running, so the audio is
# rendered by hand. The score is transcribed by SCAMP, so we still auto-capture it.
["Tutorial/24_osc_to_supercollider.py"]
skip_audio = true

["Assorted/osc_playback/osc_instrument_example.py"]
skip_audio = true
skip_score = true   # (an OSC instrument demo -- no score to capture)
